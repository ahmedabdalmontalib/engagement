<style>
/* ==========================================================================
   Tokens
   ========================================================================== */
:root{
  --cream:#fff6ec; --peach:#ffcf9f; --coral:#f28b6e; --rose:#c45a7a; --plum:#3b1f4a; --night:#0b1027;
  --flame:#ffb347; --flame-hi:#fff0c2;
  --glass:rgba(48,22,52,.32); --glass-line:rgba(255,236,220,.28);
  --text:#fff7ef; --soft:rgba(255,240,226,.82);
  --script:"Allura","Snell Roundhand",cursive;
  --serif:"Playfair Display",Georgia,serif;
  --sans:"Manrope","Helvetica Neue",Arial,sans-serif;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
  --gutter:clamp(16px,5vw,48px);
}
html[lang="ar"]{
  --script:"Rakkas","Noto Naskh Arabic",serif;
  --serif:"Noto Naskh Arabic","Playfair Display",serif;
  --sans:"Cairo","Manrope",sans-serif;
}

/* ==========================================================================
   Base
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:#f29a77}
html.locked,html.locked body{overflow:hidden}
body{margin:0;min-height:100vh;color:var(--text);font-family:var(--serif);font-size:clamp(18px,.5vw + 15px,21px);line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
html[lang="ar"] body{line-height:1.9}
svg{display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
a{color:inherit;-webkit-tap-highlight-color:transparent}
p,h1,h2,h3{margin:0}
:focus-visible{outline:2px solid var(--flame-hi);outline-offset:4px}
::selection{background:var(--flame);color:var(--plum)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#world{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1}
body.intro-on main{visibility:hidden}

.eyebrow{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.32em;margin-right:-.32em;text-transform:uppercase;color:var(--flame-hi);text-shadow:0 1px 10px rgba(80,30,40,.45)}
html[lang="ar"] :is(.eyebrow,.btn,.chip,.lbl,.toast,.begin-hint,.sound-pref,.skip,.hero-date,.foot,.loader-txt,.date-sub,.scroll-cue){letter-spacing:0;margin-right:0;text-transform:none}
html[lang="ar"] .eyebrow{font-size:15px}
html[lang="ar"] :is(.lede,.story-line,.date-line,.wish-note,.count-done,.venue-sub){font-style:normal}
.glow-text{text-shadow:0 0 18px rgba(255,190,110,.75),0 0 46px rgba(255,140,90,.45),0 2px 6px rgba(70,20,40,.35)}

/* Frosted glass panels keep text readable over any sky */
.glass{position:relative;width:min(100%,560px);padding:clamp(34px,7vw,56px) clamp(24px,6vw,48px);border-radius:32px;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 30px 60px -30px rgba(40,10,30,.6),inset 0 1px 0 rgba(255,255,255,.18)}

/* ==========================================================================
   Buttons
   ========================================================================== */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;border:1px solid rgba(255,240,226,.6);background:rgba(255,240,226,.08);color:var(--text);font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;overflow:hidden;isolation:isolate;transition:transform .5s var(--ease-out),box-shadow .5s,background-color .5s}
html[lang="ar"] .btn{font-size:15px}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,214,150,.55),transparent 60%);opacity:0;transition:opacity .4s}
.btn:hover{box-shadow:0 0 30px rgba(255,180,100,.45)}
.btn:hover::before{opacity:1}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;flex:none}
.btn-warm{background:linear-gradient(135deg,#ffd48a,#ff9f6b 55%,#e8738a);border-color:transparent;color:#3b1f4a}
.btn-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px}

/* ==========================================================================
   Access screen (testing only; turned off with CONFIG.testAccess.enabled)
   ========================================================================== */
#gate{position:fixed;inset:0;z-index:130;display:grid;place-items:center;padding:24px var(--gutter);background:linear-gradient(180deg,#ffb88c,#f28b6e 45%,#6b3e7a);transition:opacity .9s ease,visibility .9s}
#gate[hidden]{display:none}
#gate.done{opacity:0;visibility:hidden}
#gate .glass{width:min(100%,430px);text-align:center}
.gate-lantern{width:44px;height:60px;margin:0 auto 14px;border-radius:40% 40% 18% 18%/30% 30% 10% 10%;background:radial-gradient(circle at 50% 75%,#fff2c8,#ffb347 45%,#e8733a);box-shadow:0 0 30px 6px rgba(255,180,90,.7)}
.gate-title{font-family:"Playfair Display",serif;font-weight:500;font-size:clamp(30px,8vw,40px)}
.gate-title-ar{font-family:"Rakkas",serif;font-size:clamp(28px,7.5vw,34px);color:var(--flame-hi)}
.gate-note{max-width:30ch;margin:12px auto 0;font-size:17px;line-height:1.5;color:var(--soft)}
.gate-note[lang="ar"]{margin-top:6px;font-family:"Noto Naskh Arabic",serif;line-height:1.8}
#gateForm{margin-top:24px;display:flex;flex-direction:column;gap:14px}
#gateCode{width:100%;padding:10px 4px 12px;border:0;border-bottom:1px solid rgba(255,240,226,.6);border-radius:0;background:transparent;color:var(--text);font-family:"Manrope",sans-serif;font-size:18px;letter-spacing:.14em;text-align:center;outline:0;-webkit-appearance:none;appearance:none}
#gateCode::placeholder{color:rgba(255,240,226,.55);letter-spacing:.04em}
#gateCode:focus{border-bottom-color:#fff;box-shadow:0 1px 0 0 #fff}
.gate-err{min-height:1.5em;font-size:15px;color:#ffe2c0}
.glass.shake{animation:shake .5s ease}
.gate-request{display:inline-flex;align-items:center;min-height:44px;margin-top:4px;font-family:"Manrope",sans-serif;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--flame-hi)}
.gate-request[hidden]{display:none}

/* ==========================================================================
   Loader
   ========================================================================== */
#loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:linear-gradient(180deg,#ffb88c,#f28b6e);transition:opacity 1s ease,visibility 1s}
#loader.done{opacity:0;visibility:hidden}
.loader-inner{display:flex;flex-direction:column;align-items:center;gap:20px}
.loader-sun{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle,#fff6d8,#ffd27a 55%,#ff9b5c);box-shadow:0 0 40px 10px rgba(255,210,140,.8);animation:breathe 2.4s ease-in-out infinite}
.loader-txt{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.36em;margin-right:-.36em;text-transform:uppercase;color:#fff4e6}

/* ==========================================================================
   Opening: light the lantern
   ========================================================================== */
#intro{position:fixed;inset:0;z-index:50;height:100vh;height:100dvh;overflow:hidden;transition:opacity 1.4s ease}
#intro[hidden]{display:none}
#intro.leaving{opacity:0;pointer-events:none}
.begin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px var(--gutter);text-align:center}
.begin-for{display:flex;flex-direction:column;align-items:center;transition:opacity .8s}
.begin-for .script{margin:2px 0 0;font-family:var(--script);font-size:clamp(46px,12vw,72px);line-height:1.2;letter-spacing:0;text-transform:none;color:#fff}
html[lang="ar"] .begin-for .script{font-size:clamp(36px,9vw,54px);line-height:1.6}
.lamp{position:relative;width:82px;height:112px;margin:26px 0 8px;transition:transform 3.6s cubic-bezier(.45,0,.2,1)}
.lamp-body{position:absolute;inset:0;border-radius:44% 44% 16% 16%/34% 34% 10% 10%;border-top:3px solid rgba(120,60,40,.55);border-bottom:4px solid rgba(110,50,35,.6);background:linear-gradient(90deg,rgba(160,90,60,.18),transparent 25%,transparent 75%,rgba(160,90,60,.18)),linear-gradient(180deg,#f6dcbc,#e4b98d);box-shadow:inset 0 -12px 20px rgba(140,70,50,.25),0 10px 24px rgba(90,30,30,.25);transition:background .9s,box-shadow .9s}
.lamp-body::before,.lamp-body::after{content:"";position:absolute;top:8%;bottom:6%;width:1px;background:rgba(150,80,60,.35)}
.lamp-body::before{left:34%}.lamp-body::after{right:34%}
.lamp-flame{position:absolute;left:50%;bottom:10%;width:16px;height:22px;margin-left:-8px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff,#ffd27a 50%,#ff8a3d);opacity:0;transform:scale(.3);transition:opacity .6s,transform .8s cubic-bezier(.3,1.6,.5,1)}
.lamp-halo{position:absolute;inset:-60%;border-radius:50%;background:radial-gradient(circle,rgba(255,200,120,.55),rgba(255,150,90,.15) 45%,transparent 70%);opacity:0;transition:opacity 1.2s;pointer-events:none}
.lamp-ring{position:absolute;inset:-18%;border-radius:50%;border:1px solid rgba(255,240,220,.7);animation:pulse 2.6s ease-out infinite;pointer-events:none}
.lamp:hover .lamp-body{box-shadow:inset 0 -12px 20px rgba(140,70,50,.25),0 0 30px rgba(255,220,180,.6)}
#intro.lit .lamp-body{background:radial-gradient(circle at 50% 78%,#fff2c8,#ffc061 40%,#f0803c 80%);box-shadow:0 0 40px 10px rgba(255,170,90,.65)}
#intro.lit .lamp-flame{opacity:1;transform:scale(1);animation:flicker .18s ease-in-out infinite alternate}
#intro.lit .lamp-halo{opacity:1}
#intro.lit .lamp-ring{display:none}
#intro.rising .lamp{transform:translateY(-120vh) scale(.5)}
.begin-hint{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.34em;margin-right:-.34em;text-transform:uppercase;transition:opacity .6s}
html[lang="ar"] .begin-hint{font-size:16px}
.sound-pref{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;border:1px solid rgba(255,240,226,.45);border-radius:999px;transition:opacity .6s,border-color .4s}
#intro.lit :is(.begin-hint,.sound-pref,.begin-for,.intro-lang){opacity:0;pointer-events:none}
.intro-lang{position:absolute;z-index:4;top:calc(env(safe-area-inset-top) + 12px);right:calc(var(--gutter) - 6px);transition:opacity .5s}
.skip{position:absolute;z-index:3;right:calc(var(--gutter) - 8px);bottom:calc(env(safe-area-inset-bottom) + 14px);min-height:44px;padding:0 10px;font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--soft)}
html[dir="rtl"] .skip{right:auto;left:calc(var(--gutter) - 8px)}
.intro-caption{position:absolute;left:var(--gutter);right:var(--gutter);top:42%;pointer-events:none;text-align:center;font-style:italic;font-size:clamp(24px,6vw,36px);line-height:1.35;opacity:0;transform:translateY(16px);filter:blur(6px);transition:opacity 1.2s,transform 1.4s var(--ease-out),filter 1.2s}
.intro-caption.show{opacity:1;transform:none;filter:none}
html[lang="ar"] .intro-caption{font-style:normal}

/* Equalizer bars (music) */
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.bars i{display:block;width:2px;height:3px;background:currentColor;border-radius:1px}
.playing .bars i{animation:eq .9s ease-in-out infinite alternate}
.playing .bars i:nth-child(2){animation-delay:-.3s}
.playing .bars i:nth-child(3){animation-delay:-.6s}
.playing .bars i:nth-child(4){animation-delay:-.15s}

/* ==========================================================================
   Top bar, progress, toast
   ========================================================================== */
.topbar{position:fixed;z-index:20;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) var(--gutter) 10px;transition:opacity 1s ease .4s}
body.intro-on .topbar{opacity:0;pointer-events:none;visibility:hidden}
.brand{display:inline-flex;align-items:center;min-height:44px;font-family:"Allura",cursive;font-size:30px;line-height:1;text-decoration:none;direction:ltr}
.top-actions{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-family:"Cairo",sans-serif;font-size:14px}
.chip[lang="en"]{font-family:"Manrope",sans-serif;font-size:12px;font-weight:600;letter-spacing:.16em}
.music-btn .note{width:18px;height:18px}
.music-btn .bars,.music-btn.playing .note{display:none}
.music-btn.playing .bars{display:inline-flex}
.progress{position:fixed;z-index:21;left:0;right:0;top:0;height:3px;pointer-events:none}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#ffd48a,#ff9f6b,#e8738a);transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 12px rgba(255,170,90,.8)}
html[dir="rtl"] .progress span{transform-origin:100% 50%}
.toast{position:fixed;z-index:95;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translate(-50%,16px);padding:13px 22px;border-radius:999px;background:rgba(48,22,52,.88);border:1px solid var(--glass-line);font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .5s,transform .6s var(--ease-out);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ==========================================================================
   Reveal
   ========================================================================== */
[data-reveal]{opacity:0;transform:translateY(36px) scale(.97);filter:blur(8px);transition:opacity 1.2s var(--ease-out) var(--d,0s),transform 1.5s var(--ease-out) var(--d,0s),filter 1.2s ease var(--d,0s)}
[data-reveal].in{opacity:1;transform:none;filter:none}
[data-reveal="float"]{transform:translateY(120px) rotate(-3deg) scale(.9)}

/* ==========================================================================
   Sections
   ========================================================================== */
.sec{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(90px,14vh,150px) var(--gutter)}
.sec-hero{min-height:100vh;min-height:100svh;justify-content:center;isolation:isolate}
.sec-hero::before{content:"";position:absolute;inset:8% -20%;z-index:-1;background:radial-gradient(closest-side,rgba(59,31,74,.42),rgba(59,31,74,.18) 60%,transparent);pointer-events:none}
.hero-eyebrow,.lede,.hero-date{opacity:0;transform:translateY(16px);transition:opacity 1.4s ease,transform 1.4s var(--ease-out)}
body.formed .hero-eyebrow{opacity:1;transform:none;transition-delay:.3s}
body.formed .lede{opacity:1;transform:none;transition-delay:1.6s}
body.formed .hero-date{opacity:1;transform:none;transition-delay:2s}
.names{margin:.15em 0 .2em;display:flex;flex-direction:column;align-items:center;font-family:var(--script);font-weight:400;line-height:1;color:#fff}
.names:focus{outline:none}
.name{font-size:clamp(92px,25vw,210px);line-height:1.08;opacity:0;filter:blur(14px);transform:scale(1.12);transition:opacity 1.6s ease,filter 1.6s ease,transform 2s var(--ease-out)}
.names .name:last-child{transition-delay:.4s}
html[lang="ar"] .name{font-size:clamp(70px,20vw,170px);line-height:1.35}
.amp{font-family:"Playfair Display",serif;font-style:italic;font-size:clamp(30px,6vw,52px);color:var(--flame-hi);opacity:0;transition:opacity 1.4s ease .3s}
html[lang="ar"] .amp{font-family:"Rakkas",serif;font-style:normal;font-size:clamp(40px,9vw,68px)}
body.formed .name{opacity:1;filter:none;transform:none}
body.formed .amp{opacity:1}
.lede{max-width:24ch;font-style:italic;font-size:clamp(22px,3vw,30px);line-height:1.4}
html[lang="ar"] .lede{max-width:30ch}
.hero-date{margin-top:22px;font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.3em;margin-right:-.3em;text-transform:uppercase}
html[lang="ar"] .hero-date{font-size:16px}
.scroll-cue{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;min-width:44px;padding:6px;text-decoration:none;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.36em;margin-right:-.36em;text-transform:uppercase;opacity:0;transition:opacity 1.6s ease 2.6s}
body.formed .scroll-cue{opacity:1}
.scroll-cue .cue-line{display:block;width:1px;height:44px;background:rgba(255,240,226,.25);overflow:hidden}
.scroll-cue .cue-line::after{content:"";display:block;width:100%;height:100%;background:linear-gradient(180deg,transparent,#fff);animation:cue 2.2s var(--ease-io) infinite}

/* Story */
.story-lines{display:flex;flex-direction:column;gap:18px;margin-top:22px}
.story-line{font-style:italic;font-size:clamp(22px,4.6vw,30px);line-height:1.4}
.story-line:nth-child(2){font-family:var(--script);font-style:normal;font-size:clamp(46px,11vw,72px);line-height:1.1;color:var(--flame-hi)}
html[lang="ar"] .story-line:nth-child(2){font-size:clamp(34px,8vw,52px);line-height:1.6}

/* Date: the numbers rest on the water with a rippling reflection */
.date-block{position:relative;margin-top:26px;display:flex;flex-direction:column;align-items:center}
.date-day{font-family:var(--serif);font-weight:400;font-size:clamp(120px,34vw,240px);line-height:.95;background:linear-gradient(180deg,#fff6d8 10%,#ffc370 55%,#f07a5a 95%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 24px rgba(255,170,90,.55))}
html[lang="ar"] .date-day{line-height:1.3}
.date-reflect{margin-top:-.08em;transform:scaleY(-.62);transform-origin:50% 0;opacity:.45;-webkit-mask-image:repeating-linear-gradient(180deg,#000 0 3px,transparent 3px 6px),linear-gradient(180deg,#000,transparent 80%);mask-image:repeating-linear-gradient(180deg,#000 0 3px,transparent 3px 6px),linear-gradient(180deg,#000,transparent 80%);-webkit-mask-composite:source-in;mask-composite:intersect;-webkit-mask-size:100% 6px,100% 100%;mask-size:100% 6px,100% 100%;animation:ripple 1.6s linear infinite;filter:blur(1px);pointer-events:none}
.date-sub{margin-top:-16px;font-family:var(--sans);font-size:clamp(13px,3.4vw,16px);font-weight:600;letter-spacing:.34em;margin-right:-.34em;text-transform:uppercase}
html[lang="ar"] .date-sub{font-size:18px}
.date-line{margin-top:10px;font-style:italic;font-size:clamp(21px,2.8vw,27px)}
.date-line span{color:var(--flame-hi)}
.cal{position:relative;margin-top:24px}
.cal-menu{position:absolute;left:50%;top:calc(100% + 10px);z-index:5;min-width:250px;transform:translateX(-50%);display:flex;flex-direction:column;padding:8px;border-radius:22px;background:rgba(48,22,52,.95);border:1px solid var(--glass-line);box-shadow:0 30px 60px -20px rgba(20,0,20,.7)}
.cal-menu[hidden]{display:none}
.cal-menu a,.cal-menu button{display:flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:16px;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
.cal-menu a:hover,.cal-menu button:hover{background:rgba(255,200,140,.15)}

/* Countdown: four bobbing lanterns */
.lanterns{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,3vw,26px);width:min(100%,600px);margin-top:36px}
.lan{display:flex;flex-direction:column;align-items:center}
.lan-body{animation:bob 4s ease-in-out infinite;animation-delay:calc(var(--k) * -1s);position:relative;width:100%;max-width:110px;aspect-ratio:3/4;display:grid;place-items:center;border-radius:40% 40% 18% 18%/30% 30% 10% 10%;background:radial-gradient(circle at 50% 78%,#fff2c8,#ffc061 40%,#f0803c 85%);box-shadow:0 0 34px 6px rgba(255,170,90,.55);color:#4a1f2a;font-family:var(--serif);font-size:clamp(28px,8vw,46px);font-weight:500;font-variant-numeric:lining-nums tabular-nums}
.lan-body::before{content:"";position:absolute;top:-10px;left:50%;width:1px;height:10px;background:rgba(255,240,226,.7)}
.lan-body::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,transparent 30%,rgba(255,255,255,.18) 31%,transparent 33%,transparent 66%,rgba(255,255,255,.18) 67%,transparent 69%);pointer-events:none}
.lan-body span{position:relative;z-index:1}
.lan-body.tick{animation:bob 4s ease-in-out infinite,flare .7s ease-out;animation-delay:calc(var(--k) * -1s),0s}
.lbl{margin-top:12px;font-family:var(--sans);font-size:clamp(9.5px,2.5vw,11.5px);font-weight:600;letter-spacing:.22em;margin-right:-.22em;text-transform:uppercase}
html[lang="ar"] .lbl{font-size:clamp(12px,3vw,14px)}
.count-done{margin-top:30px;font-style:italic;font-size:clamp(22px,3vw,28px)}

/* Venue */
.venue-name{margin-top:14px;font-family:var(--serif);font-weight:500;font-size:clamp(50px,12vw,100px);line-height:1.1}
html[lang="ar"] .venue-name{line-height:1.5}
.venue-sub{font-style:italic;font-size:clamp(20px,2.6vw,25px);color:var(--soft)}
.map{position:relative;width:100%;aspect-ratio:4/5;margin-top:24px;border-radius:24px;overflow:hidden;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black);background:rgba(255,240,226,.12)}
@media (min-width:640px){.map{aspect-ratio:16/11}}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;filter:sepia(.45) saturate(1.2) hue-rotate(-12deg) contrast(1.02);transition:opacity 1.2s}
.map.loaded iframe{opacity:1}
.map::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 40px rgba(60,20,40,.35);border-radius:inherit}
.map-wait{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.3em;text-transform:uppercase}
.map.loaded .map-wait{display:none}

/* Finale */
.sec-finale{min-height:100vh;min-height:100svh;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom) + 70px)}
.wish-btn{margin-top:26px}
.wish-note{min-height:1.6em;margin-top:14px;font-style:italic;font-size:clamp(19px,4.4vw,24px);color:var(--flame-hi);opacity:0;transition:opacity .8s}
.wish-note.show{opacity:1}
.finale-title{margin-top:36px;font-family:var(--script);font-size:clamp(58px,15vw,130px);line-height:1.1}
html[lang="ar"] .finale-title{font-size:clamp(42px,11vw,96px);line-height:1.6}
.finale-names{margin-top:6px;font-family:var(--serif);font-style:italic;font-size:clamp(22px,4.6vw,32px)}
html[lang="ar"] .finale-names{font-style:normal}
.finale-date{margin-top:6px;font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.4em;margin-right:-.4em}
.foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--soft)}

@media (max-width:600px){
  .sec{padding-top:72px;padding-bottom:72px}
  .sec-finale{min-height:92vh;min-height:92svh;padding-bottom:calc(env(safe-area-inset-bottom) + 70px)}
}

/* ==========================================================================
   Keyframes
   ========================================================================== */
@keyframes breathe{50%{transform:scale(1.12);box-shadow:0 0 60px 18px rgba(255,210,140,.9)}}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@keyframes flicker{from{transform:scale(1) translateY(0)}to{transform:scale(.92,1.06) translateY(-1px)}}
@keyframes eq{from{height:3px}to{height:14px}}
@keyframes cue{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
@keyframes flare{0%{box-shadow:0 0 70px 22px rgba(255,210,130,.95)}100%{box-shadow:0 0 34px 6px rgba(255,170,90,.55)}}
@keyframes ripple{from{-webkit-mask-position:0 0,0 0;mask-position:0 0,0 0}to{-webkit-mask-position:0 6px,0 0;mask-position:0 6px,0 0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;animation-delay:0s!important;transition-delay:0s!important}
}
</style>

<body class="intro-on">

<canvas id="world" aria-hidden="true"></canvas>

<!-- Access screen (testing only) -->
<div id="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="glass">
    <div class="gate-lantern" aria-hidden="true"></div>
    <p class="eyebrow">Private preview · <span lang="ar">معاينة خاصة</span></p>
    <h1 class="gate-title" id="gateTitle">Request access</h1>
    <p class="gate-title-ar" lang="ar" dir="rtl">طلب الدخول</p>
    <p class="gate-note">This invitation is still being prepared. Enter the access code you were given.</p>
    <p class="gate-note" lang="ar" dir="rtl">الدعوة قيد التجهيز. أدخل رمز الدخول الذي وصلك.</p>
    <form id="gateForm" novalidate>
      <label class="sr-only" for="gateCode">Access code</label>
      <input id="gateCode" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="60" placeholder="Access code · رمز الدخول">
      <button class="btn btn-warm" type="submit">Enter · دخول</button>
      <p class="gate-err" role="alert"></p>
    </form>
    <a class="gate-request" hidden target="_blank" rel="noopener">Request a code · اطلب الرمز</a>
  </div>
</div>

<!-- Loading state -->
<div id="loader" role="status">
  <div class="loader-inner">
    <div class="loader-sun" aria-hidden="true"></div>
    <p class="loader-txt" data-t="loading">Waiting for golden hour</p>
  </div>
</div>

<!-- Opening: light the lantern -->
<section id="intro" aria-label="Invitation opening">
  <div class="intro-lang"><button class="chip lang-btn" type="button"></button></div>
  <div class="begin">
    <p class="begin-for eyebrow"><span data-t="forGuest"></span><span class="script" data-c="guest"></span></p>
    <button class="lamp" type="button" data-ta="lightAria"><span class="lamp-halo"></span><span class="lamp-ring"></span><span class="lamp-body"></span><span class="lamp-flame"></span></button>
    <p class="begin-hint" data-t="lightHint"></p>
    <button class="sound-pref playing" type="button" aria-pressed="true"><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="sp-label"></span></button>
  </div>
  <p class="intro-caption glow-text" data-t="caption"></p>
  <button class="skip" type="button" data-t="skip"></button>
</section>

<!-- Persistent chrome -->
<div class="progress" aria-hidden="true"><span></span></div>
<header class="topbar">
  <a class="brand glow-text" href="#hero" data-ta="backTop"><span data-c="i1"></span>&amp;<span data-c="i2"></span></a>
  <div class="top-actions">
    <button class="chip lang-btn" type="button"></button>
    <button class="chip music-btn" type="button" aria-pressed="false"><svg class="note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.8" cy="17.6" r="2.3"/><circle cx="16.8" cy="15.6" r="2.3"/><path d="M9 9.5l10-2"/></svg><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
  </div>
</header>

<main id="main">
  <!-- Hero -->
  <section id="hero" class="sec sec-hero">
    <p class="eyebrow hero-eyebrow" data-t="heroEyebrow"></p>
    <h1 class="names glow-text" tabindex="-1">
      <span class="name" data-c="p1"></span>
      <span class="amp" data-t="amp"></span>
      <span class="name" data-c="p2"></span>
    </h1>
    <p class="lede glow-text" data-t="lede"></p>
    <p class="hero-date glow-text"><span data-c="weekday"></span> · <span data-c="dayMonthYear"></span></p>
    <a class="scroll-cue" href="#story" data-ta="scrollAria"><span data-t="scroll"></span><span class="cue-line"></span></a>
  </section>

  <!-- Story -->
  <section id="story" class="sec">
    <div class="glass" data-reveal="float">
      <p class="eyebrow" data-t="storyEyebrow"></p>
      <div class="story-lines">
        <p class="story-line" data-reveal style="--d:.3s" data-t="story1"></p>
        <p class="story-line glow-text" data-reveal style="--d:.7s" data-t="story2"></p>
        <p class="story-line" data-reveal style="--d:1.1s" data-t="story3"></p>
      </div>
    </div>
  </section>

  <!-- Date -->
  <section id="date" class="sec">
    <div class="glass" data-reveal="float">
    <p class="eyebrow" data-reveal data-t="dateEyebrow"></p>
    <div class="date-block" data-reveal style="--d:.15s">
      <span class="date-day" data-c="day"></span>
      <span class="date-day date-reflect" aria-hidden="true" data-c="day"></span>
      <p class="date-sub glow-text"><span data-c="weekday"></span> · <span data-c="month"></span> <span data-c="year"></span></p>
    </div>
    <p class="date-line glow-text" data-reveal style="--d:.35s" data-th="beginning"></p>
    <div class="cal" data-reveal style="--d:.5s">
      <button class="btn" type="button" id="calBtn" aria-expanded="false" aria-controls="calMenu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span data-t="addCal"></span>
      </button>
      <div class="cal-menu" id="calMenu" hidden>
        <a id="gcalLink" href="#" target="_blank" rel="noopener" data-t="gcal"></a>
        <button type="button" id="icsBtn" data-t="ics"></button>
      </div>
    </div>
    </div>
  </section>

  <!-- Countdown -->
  <section id="countdown" class="sec">
    <p class="eyebrow" data-reveal data-t="countEyebrow"></p>
    <h2 class="venue-name glow-text" data-reveal style="--d:.15s;font-size:clamp(34px,8vw,64px)" data-t="countTitle"></h2>
    <div class="lanterns" role="timer" aria-label="">
      <div class="lan" style="--k:0" data-reveal="float"><div class="lan-body"><span data-u="d"></span></div><span class="lbl glow-text" data-t="days"></span></div>
      <div class="lan" style="--k:1.1" data-reveal="float"><div class="lan-body"><span data-u="h"></span></div><span class="lbl glow-text" data-t="hours"></span></div>
      <div class="lan" style="--k:2.3" data-reveal="float"><div class="lan-body"><span data-u="m"></span></div><span class="lbl glow-text" data-t="minutes"></span></div>
      <div class="lan" style="--k:3.2" data-reveal="float"><div class="lan-body"><span data-u="s"></span></div><span class="lbl glow-text" data-t="seconds"></span></div>
    </div>
    <p class="count-done glow-text" hidden data-t="countDone"></p>
  </section>

  <!-- Venue -->
  <section id="venue" class="sec">
    <div class="glass" data-reveal="float">
      <p class="eyebrow" data-t="venueEyebrow"></p>
      <h2 class="venue-name" data-c="venueName"></h2>
      <p class="venue-sub" data-c="venueSub"></p>
      <div class="map">
        <div class="map-wait" data-t="mapLoading"></div>
        <iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen data-tt="mapTitle"></iframe>
      </div>
      <div class="btn-row">
        <a class="btn btn-warm" id="dirLink" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 2l9 9-9 11-9-11z"/><path d="M12 8v7M9 11l3-3 3 3"/></svg>
          <span data-t="directions"></span>
        </a>
        <button class="btn" type="button" id="copyAddr" data-t="copyAddr"></button>
      </div>
    </div>
  </section>

  <!-- Finale -->
  <section id="finale" class="sec sec-finale">
    <p class="eyebrow" data-reveal data-t="wishEyebrow"></p>
    <button class="btn btn-warm wish-btn" type="button" data-reveal style="--d:.2s"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4h10l-2 14H9z" opacity=".9"/><circle cx="12" cy="15" r="2" fill="#fff2c8"/></svg><span data-t="release"></span></button>
    <p class="wish-note" aria-live="polite"></p>

      <button class="btn" type="button" id="shareBtn" data-t="share"></button>
    </div>
    <p class="foot glow-text" data-t="foot"></p>
  </section>
</main>

    if (cache.has(m)) return cache.get(m);
    const sr = ac.sampleRate, N = Math.max(2, Math.round(sr / mtof(m))), len = Math.floor(sr * 2.2);
    const buf = ac.createBuffer(1, len, sr), d = buf.getChannelData(0), ring = new Float32Array(N);
    for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
    let idx = 0;
    for (let i = 0; i < len; i++) {
      const cur = ring[idx], nxt = ring[(idx + 1) % N];
      ring[idx] = (cur + nxt) * .5 * .994;
      d[i] = cur * (i < 30 ? i / 30 : 1);
      idx = (idx + 1) % N;
    }
    cache.set(m, buf);
    return buf;
  }
  function pluck(t, m, v) {
    const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
    s.buffer = pluckBuffer(m);
    f.type = 'lowpass'; f.frequency.value = 2600;
    g.gain.value = v;
    s.connect(f).connect(g).connect(bus);
    s.start(t);
  }
  function schedule() {
    while (next < ac.currentTime + .3) {
      const bar = Math.floor(step / 8), i = step % 8, deg = BARS[bar % 4][i];
      if (i === 0) pluck(next, 50, .32);
      if (i === 4) pluck(next, 57, .2);
      if (deg >= 0) {
        pluck(next + Math.random() * .01, HIJAZ[deg], i % 2 ? .2 : .3);
        // A quick ornament now and then, as an oud player would add
        if (i === 6 && bar % 2) pluck(next + EIGHTH / 2, HIJAZ[Math.min(7, deg + 1)], .14);
      }
      next += EIGHTH; step++;
    }
  }
  function notify() { listeners.forEach(fn => fn(on)); }
  async function play() {
    if (on) return;
    on = true; notify();
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
    if (CONFIG.music.src) {
      if (!el) { el = new Audio(CONFIG.music.src); el.loop = true; el.volume = 0; }
      clearInterval(fadeT);
      try { await el.play(); } catch { on = false; notify(); return; }
      fadeT = setInterval(() => { el.volume = Math.min(.8, el.volume + .04); if (el.volume >= .8) clearInterval(fadeT); }, 80);
      return;
    }
    if (!ac) build();
    try { await ac.resume(); } catch {}
    const now = ac.currentTime;
    out.gain.cancelScheduledValues(now);
    out.gain.setValueAtTime(out.gain.value, now);
    out.gain.linearRampToValueAtTime(.85, now + 2);
    if (!timer) { next = now + .12; schedule(); timer = setInterval(schedule, 60); }
  }
  function pause() {
    if (!on) return;
    on = false; notify();
    if (el) {
      clearInterval(fadeT);
      fadeT = setInterval(() => { el.volume = Math.max(0, el.volume - .05); if (el.volume <= 0) { clearInterval(fadeT); if (!on) el.pause(); } }, 60);
      return;
    }
    if (!ac) return;
    const now = ac.currentTime;
    out.gain.cancelScheduledValues(now);
    out.gain.setValueAtTime(out.gain.value, now);
    out.gain.linearRampToValueAtTime(0, now + .8);
    setTimeout(() => { if (!on) { clearInterval(timer); timer = 0; ac.suspend(); } }, 900);
  }
  let resumeOnShow = false;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { resumeOnShow = on; pause(); }
    else if (resumeOnShow) { resumeOnShow = false; play(); }
  });
  return { play, pause, toggle: () => (on ? pause() : play()), get on() { return on; }, onChange: fn => listeners.push(fn) };
})();
let soundPref = true;
function setSoundPref(on) {
  soundPref = on;
  const b = $('.sound-pref');
  b.setAttribute('aria-pressed', on);
  b.classList.toggle('playing', on);
  $('.sp-label', b).textContent = T(on ? 'withMusic' : 'inSilence');
}
function syncMusicUI(on) {
  const b = $('.music-btn');
  b.classList.toggle('playing', on);
  b.setAttribute('aria-pressed', on);
  b.setAttribute('aria-label', T(on ? 'pauseMusic' : 'playMusic'));
}
Music.onChange(syncMusicUI);

/* ==========================================================================
   Opening: light the lantern → it rises → a wave of lanterns → the names glow
   ========================================================================== */
const Intro = (() => {
  const el = $('#intro');
  let timers = [], stage = 'idle';
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  function start() {
    clear();
    stage = 'ready';
    html.classList.add('locked');
    document.body.classList.add('intro-on');
    document.body.classList.remove('formed');
    jumpTop();
    World.setProgress(0);
    el.hidden = false;
    el.className = '';
    $('.intro-caption').classList.remove('show');
    // After "Watch the sunset again", move focus off the now-hidden page onto the lantern.
    if (document.activeElement && document.activeElement.closest && document.activeElement.closest('main')) setTimeout(() => $('.lamp').focus({ preventScroll: true }), 200);
  }
  function light() {
    if (stage !== 'ready') return;
    stage = 'story';
    if (soundPref) Music.play();
    try { navigator.vibrate && navigator.vibrate(12); } catch {}
    el.classList.add('lit');
    if (reduce) { later(finish, 300); return; }
    later(() => { el.classList.add('rising'); $('.intro-caption').classList.add('show'); World.burst(small ? 26 : 40); }, 900);
    later(() => $('.intro-caption').classList.remove('show'), 3400);
    later(finish, 4200);
  }
  function finish() {
    clear();
    stage = 'done';
    document.body.classList.remove('intro-on');
    document.body.classList.add('formed');
    html.classList.remove('locked');
    el.classList.add('leaving');
    Page.start();
    later(() => { el.hidden = true; el.className = ''; }, 1500);
  }
  function skip() { if (stage !== 'done') finish(); }
  $('.lamp').addEventListener('click', light);
  $('.skip').addEventListener('click', skip);
  $('.sound-pref').addEventListener('click', () => setSoundPref(!soundPref));
  return { start };
})();

/* ==========================================================================
   Page: reveals, the evening following the scroll, progress
   ========================================================================== */
const Page = (() => {
  let started = false, ticking = false;
  const reveal = new IntersectionObserver(entries => entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); reveal.unobserve(e.target); }
  }), { threshold: .15, rootMargin: '0px 0px -6% 0px' });
  const bar = $('.progress span');
  function update() {
    ticking = false;
    const max = html.scrollHeight - innerHeight, p = max > 0 ? clamp(scrollY / max, 0, 1) : 0;
    World.setProgress(p);
    bar.style.transform = `scaleX(${p})`;
  }
  const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
  function start() {
    if (!started) {
      started = true;
      $$('[data-reveal]').forEach(el => reveal.observe(el));
      addEventListener('scroll', onScroll, { passive: true });
      addEventListener('resize', onScroll);
    }
    update();
    setTimeout(() => $('.names').focus({ preventScroll: true }), 600);
  }
  return { start };
})();

/* ==========================================================================
   Countdown lanterns
   ========================================================================== */
const Countdown = (() => {
  const units = Object.fromEntries($$('.lan-body span').map(s => [s.dataset.u, s]));
  const box = $('.lanterns');
  let timer = 0, lastLabel = '';
  function set(u, v) {
    const s = units[u], str = num(v, 2);
    if (s.textContent === str) return;
    const first = !s.textContent;
    s.textContent = str;
    if (!first && !reduce) { const b = s.parentElement; b.classList.remove('tick'); void b.offsetWidth; b.classList.add('tick'); }
  }
  function tick() {
    clearTimeout(timer);
    const diff = when.getTime() - Date.now();
    if (diff <= 0) {
      box.hidden = true;
      $('.count-done').hidden = false;
      box.closest('section').querySelectorAll('.eyebrow,.venue-name').forEach(e => { e.hidden = true; });
      return;
    }
    const d = Math.floor(diff / 864e5), h = Math.floor(diff / 36e5) % 24, m = Math.floor(diff / 6e4) % 60, s = Math.floor(diff / 1e3) % 60;
    set('d', d); set('h', h); set('m', m); set('s', s);
    const label = T('countLeft')(d, h, m);
    if (label !== lastLabel) { box.setAttribute('aria-label', label); lastLabel = label; }
    timer = setTimeout(tick, 1000 - (Date.now() % 1000) + 10);
  }
  return { refresh() { Object.values(units).forEach(s => { s.textContent = ''; }); lastLabel = ''; tick(); } };
})();

/* ==========================================================================
   Calendar, map, wishes, sharing
   ========================================================================== */
function utc(d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
const ends = new Date(when.getTime() + CONFIG.durationHours * 36e5);
function setupCalendarLinks() {
  const g = new URL('https://calendar.google.com/calendar/render');
  g.searchParams.set('action', 'TEMPLATE');
  g.searchParams.set('text', T('eventTitle')(C.p1, C.p2));
  g.searchParams.set('dates', `${utc(when)}/${utc(ends)}`);
  g.searchParams.set('details', T('eventText')(C.p1, C.p2));
  g.searchParams.set('location', C.address);
  $('#gcalLink').href = g.toString();
}
function setupCalendar() {
  const btn = $('#calBtn'), menu = $('#calMenu');
  const close = () => { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
  btn.addEventListener('click', e => {
    e.stopPropagation();
    menu.hidden = !menu.hidden;
    btn.setAttribute('aria-expanded', String(!menu.hidden));
  });
  document.addEventListener('click', e => { if (!e.target.closest('.cal')) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  $('#gcalLink').addEventListener('click', close);
  // A real file next to the page: iPhones and WhatsApp's browser then offer "Add to Calendar".
  $('#icsBtn').addEventListener('click', () => {
    close();
    location.href = new URL(CONFIG.icsFile, location.href).href;
  });
}
function setupVenue() {
  const q = encodeURIComponent(CONFIG.mapsQuery);
  $('#dirLink').href = CONFIG.mapsLink || `https://www.google.com/maps/search/?api=1&query=${q}`;
  $('#copyAddr').addEventListener('click', () => copy(C.address, T('addrCopied')));
  const map = $('.map'), frame = $('iframe', map);
  frame.addEventListener('load', () => { if (frame.src) map.classList.add('loaded'); });
  const io = new IntersectionObserver(([e]) => {
    if (!e.isIntersecting) return;
    frame.src = `https://maps.google.com/maps?q=${q}&z=15&output=embed`;
    io.disconnect();
  }, { rootMargin: '600px 0px' });
  io.observe(map);
}
function setupActions() {
  let wishes = 0;
  $('.wish-btn').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    World.release(r.left + r.width / 2, r.top);
    World.burst(6);
    const note = $('.wish-note');
    note.textContent = T('wishNotes')[wishes++ % 3];
    note.classList.add('show');
    try { navigator.vibrate && navigator.vibrate(10); } catch {}
  });
  $('#shareBtn').addEventListener('click', async () => {
    const url = location.href.split(/[?#]/)[0];
    const data = { title: T('eventTitle')(C.p1, C.p2), text: T('shareText')(C.p1, C.p2, C.dateLong), url };
    if (navigator.share) { try { await navigator.share(data); } catch {} }
    else copy(url, T('linkCopied'));
  });
  $('#replayBtn').addEventListener('click', () => Intro.start());
  // Pausing from the top bar also means "in silence" if the opening is replayed.
  $('.music-btn').addEventListener('click', () => { Music.toggle(); setSoundPref(Music.on); });
  $$('.lang-btn').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); setLanguage(T('langSwitchCode')); }));
  // Buttons glow where the pointer is
  if (finePointer) $$('.btn').forEach(b => b.addEventListener('pointermove', e => {
    const r = b.getBoundingClientRect();
    b.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
    b.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
  }));
}

/* ==========================================================================
   Access screen (testing only)
   ========================================================================== */
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function unlock() {
  const A = CONFIG.testAccess;
  if (!A || !A.enabled) return Promise.resolve();
  const KEY = 'invite-access';
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  if (saved === A.codeHash) return Promise.resolve();

  const gate = $('#gate'), form = $('#gateForm'), input = $('#gateCode'), err = $('.gate-err'), card = $('#gate .glass');
  const check = async code => !!(window.crypto && window.crypto.subtle) && code.trim() !== '' && (await sha256(code.trim().toLowerCase())) === A.codeHash;
  const remember = () => { try { localStorage.setItem(KEY, A.codeHash); } catch {} };

  return new Promise(async resolve => {
    // A tester link ending in ?access=CODE opens straight in; the code is then removed from the address bar.
    const fromLink = params.get('access');
    if (fromLink) {
      const u = new URL(location.href);
      u.searchParams.delete('access');
      history.replaceState(null, '', u);
      if (await check(fromLink)) { remember(); resolve(); return; }
    }
    if (A.requestWhatsApp) {
      const req = $('.gate-request');
      req.href = `https://wa.me/${A.requestWhatsApp.replace(/\D/g, '')}?text=${encodeURIComponent('Hello! May I have the access code for the engagement invitation preview?')}`;
      req.hidden = false;
    }
    gate.hidden = false;
    setTimeout(() => input.focus(), 300);
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (!(window.crypto && window.crypto.subtle)) { err.textContent = 'Please open the invitation from its https:// link.'; return; }
      if (await check(input.value)) {
        remember();
        err.textContent = '';
        gate.classList.add('done');
        setTimeout(() => gate.remove(), 1000);
        resolve();
      } else {
        err.textContent = "That code isn't right · الرمز غير صحيح";
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
        input.select();
      }
    });
  });
}

/* ==========================================================================
   Boot
   ========================================================================== */
// Touching the sky (not a button) sends up a small lantern from that spot.
if (!reduce) addEventListener('click', e => {
  if (e.target.closest('a,button,input,iframe,.glass') || document.body.classList.contains('intro-on')) return;
  World.release(e.clientX, e.clientY);
});

async function boot() {
  await unlock();
  World.start();
  applyLanguage();
  setupCalendar();
  setupVenue();
  setupActions();
  try { await Promise.race([document.fonts.ready, wait(2600)]); } catch {}
  await wait(reduce ? 150 : 600);
  $('#loader').classList.add('done');
  setTimeout(() => $('#loader').remove(), 1100);
  Intro.start();
}
boot();
})();
</script>
