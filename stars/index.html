<style>
/* ==========================================================================
   Tokens
   ========================================================================== */
:root{
  --night:#040714; --night-2:#0a1030; --indigo:#141b4d;
  --moon:#e8edff; --silver:#b9c3e6; --pearl:#f6f2ea; --gold:#e9cf98;
  --blue:#9cc7ff; --rose:#ffb7c9;
  --text:#eef1ff; --soft:#c3cbe8; --faint:rgba(195,203,232,.72);
  --line:rgba(185,195,230,.3);
  --shine:linear-gradient(105deg,#b9c3e6 0%,#ffffff 22%,#e9cf98 40%,#ffffff 55%,#c9d6ff 72%,#ffe2ea 86%,#b9c3e6 100%);
  --display:"Marcellus","Times New Roman",serif;
  --body:"EB Garamond",Garamond,serif;
  --script:"Great Vibes","Snell Roundhand",cursive;
  --label:"Marcellus","Times New Roman",serif;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
  --gutter:clamp(16px,5vw,48px);
  --write-mask:linear-gradient(100deg,#000 42%,transparent 58%);
  --write-from:100% 0; --write-to:0 0;
}
html[lang="ar"]{
  --display:"Reem Kufi","Marcellus",sans-serif;
  --body:"Amiri","EB Garamond",serif;
  --script:"Aref Ruqaa","Amiri",serif;
  --label:"Reem Kufi","Marcellus",sans-serif;
  --write-mask:linear-gradient(260deg,#000 42%,transparent 58%);
  --write-from:0 0; --write-to:100% 0;
}

/* ==========================================================================
   Base
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--night)}
html.locked,html.locked body{overflow:hidden}
body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 50% 0%,#0d1440 0%,var(--night) 60%),var(--night);color:var(--text);font-family:var(--body);font-size:clamp(18px,.5vw + 15px,21px);line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
html[lang="ar"] body{line-height:1.85}
svg{display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
a{color:inherit;-webkit-tap-highlight-color:transparent}
p{margin:0}
:focus-visible{outline:2px solid var(--moon);outline-offset:5px}
::selection{background:rgba(156,199,255,.35);color:#fff}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1}
body.intro-on main{visibility:hidden}

/* Nebula clouds drifting behind everything */
.nebula{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.nebula i{position:absolute;width:70vmax;height:70vmax;border-radius:50%}
.nebula i:nth-child(1){left:-35vmax;top:-25vmax;background:radial-gradient(closest-side,rgba(80,110,220,.16),transparent);animation:drift1 30s ease-in-out infinite alternate}
.nebula i:nth-child(2){right:-40vmax;top:25vh;background:radial-gradient(closest-side,rgba(150,80,170,.14),transparent);animation:drift2 36s ease-in-out infinite alternate}
.nebula i:nth-child(3){left:0;bottom:-50vmax;background:radial-gradient(closest-side,rgba(255,160,190,.08),transparent);animation:drift3 44s ease-in-out infinite alternate}

/* Shared type */
.eyebrow{font-family:var(--label);font-size:12.5px;letter-spacing:.42em;margin-right:-.42em;text-transform:uppercase;color:var(--silver)}
.shine-text{display:inline-block;padding:.1em .2em .18em;margin:-.1em -.2em -.18em;background:var(--shine);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:sheen 12s linear infinite}
.script{font-family:var(--script);font-weight:400}
.sec-title{margin:.35em 0 0;font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,54px);line-height:1.2;letter-spacing:.04em;color:var(--moon)}
html[lang="ar"] :is(.eyebrow,.lbl,.btn,.dots a span,.toast,.hero-date,.scroll-cue,.begin-hint,.sound-pref,.skip,.lang-btn,.cal-menu a,.cal-menu button,.finale-date,.finale-foot,.loader-txt,.time-line,.orbit-mid small){letter-spacing:0;margin-right:0;text-transform:none}
html[lang="ar"] .eyebrow{font-size:14.5px}
html[lang="ar"] :is(.lede,.story-line,.time-line,.caption,.count-done,.venue-sub){font-style:normal}

/* ==========================================================================
   Buttons
   ========================================================================== */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 26px;border:1px solid rgba(232,237,255,.45);border-radius:999px;color:var(--moon);font-family:var(--label);font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;overflow:hidden;isolation:isolate;background:rgba(10,16,48,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:border-color .5s,background-color .5s,transform .5s var(--ease-out),box-shadow .5s}
html[lang="ar"] .btn{font-size:14px}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(232,237,255,.28) 50%,transparent 70%);transform:translateX(-120%);transition:transform 1s var(--ease-out)}
.btn:hover{border-color:var(--moon);box-shadow:0 0 24px rgba(156,199,255,.3)}
.btn:hover::before{transform:translateX(120%)}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;flex:none}
.btn-solid{background:linear-gradient(105deg,#dfe6ff,#ffffff 40%,#f2dfc0 70%,#ffd9e3);color:#141b4d;border-color:transparent}
.btn-solid:hover{box-shadow:0 0 30px rgba(232,237,255,.45)}
.btn-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:30px}

/* ==========================================================================
   Access screen (testing only; turned off with CONFIG.testAccess.enabled)
   ========================================================================== */
#gate{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:24px var(--gutter);background:radial-gradient(90% 60% at 50% 0%,rgba(80,110,220,.22),transparent 70%),var(--night);transition:opacity .9s ease,visibility .9s}
#gate[hidden]{display:none}
#gate.done{opacity:0;visibility:hidden}
.gate-card{width:min(100%,420px);display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px clamp(22px,7vw,44px) 38px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(156,199,255,.08),rgba(10,16,48,.2))}
.gate-star{width:46px;height:46px;margin-bottom:20px;color:var(--moon);filter:drop-shadow(0 0 12px rgba(156,199,255,.8))}
.gate-title{margin:12px 0 0;font-family:"Marcellus",serif;font-weight:400;font-size:clamp(30px,8vw,40px);letter-spacing:.04em}
.gate-title-ar{margin-top:4px;font-family:"Aref Ruqaa",serif;font-size:clamp(28px,7.5vw,36px);line-height:1.5;color:var(--moon)}
.gate-note{max-width:30ch;margin-top:14px;font-size:17px;line-height:1.5;color:var(--soft)}
.gate-note[lang="ar"]{margin-top:6px;font-family:"Amiri",serif;line-height:1.8}
#gateForm{width:100%;margin-top:26px;display:flex;flex-direction:column;gap:14px}
#gateCode{width:100%;padding:10px 4px 12px;border:0;border-bottom:1px solid rgba(232,237,255,.45);border-radius:0;background:transparent;color:var(--moon);font-family:"Marcellus",serif;font-size:18px;letter-spacing:.14em;text-align:center;outline:0;-webkit-appearance:none;appearance:none}
#gateCode::placeholder{color:rgba(195,203,232,.5);letter-spacing:.06em}
#gateCode:focus{border-bottom-color:var(--moon);box-shadow:0 1px 0 0 var(--moon)}
.gate-err{min-height:1.5em;font-size:16px;color:#ffb7c9}
.gate-card.shake{animation:shake .5s ease}
.gate-request{margin-top:6px;font-family:"Marcellus",serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--silver);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.gate-request[hidden]{display:none}

/* ==========================================================================
   Loader
   ========================================================================== */
#loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--night);transition:opacity 1s ease,visibility 1s}
#loader.done{opacity:0;visibility:hidden}
.loader-inner{display:flex;flex-direction:column;align-items:center;gap:22px}
.loader-star{width:30px;height:30px;color:var(--moon);animation:spin 4s linear infinite;filter:drop-shadow(0 0 10px rgba(156,199,255,.8))}
.loader-txt{font-family:var(--label);font-size:11px;letter-spacing:.4em;margin-right:-.4em;text-transform:uppercase;color:var(--soft)}

/* ==========================================================================
   Opening
   ========================================================================== */
#intro{position:fixed;inset:0;z-index:50;height:100vh;height:100dvh;overflow:hidden;transition:opacity 1.4s ease}
#intro[hidden]{display:none}
#intro.leaving{opacity:0;pointer-events:none}
.intro-vignette{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 50%,transparent 45%,rgba(0,0,0,.6) 100%);pointer-events:none}
.begin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px var(--gutter);text-align:center;transition:opacity 1s ease,transform 1.2s var(--ease-io),filter 1s}
#intro.begun .begin{opacity:0;transform:scale(1.15);filter:blur(8px);pointer-events:none}
.begin-for{display:flex;flex-direction:column;align-items:center;font-family:var(--label);font-size:12px;letter-spacing:.38em;margin-right:-.38em;text-transform:uppercase;color:var(--silver);opacity:0;animation:rise 1.6s var(--ease-out) .6s forwards}
html[lang="ar"] .begin-for{letter-spacing:0;margin-right:0;font-size:15px}
.begin-for .script{margin-top:6px;font-size:clamp(34px,9vw,52px);line-height:1.3;letter-spacing:0;text-transform:none;color:var(--moon)}
.begin-star{position:relative;width:150px;height:150px;margin:18px 0 6px;border-radius:50%;opacity:0;animation:fadeIn 2s ease .2s forwards}
.begin-star .core{position:absolute;inset:44%;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px #fff,0 0 40px 16px rgba(156,199,255,.75),0 0 100px 36px rgba(255,183,201,.3);animation:corePulse 2.6s ease-in-out infinite}
.begin-star .flare{position:absolute;inset:0;animation:spin 18s linear infinite}
.begin-star .flare::before,.begin-star .flare::after{content:"";position:absolute;left:50%;top:50%;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);transform:translate(-50%,-50%)}
.begin-star .flare::before{width:150%;height:2px}
.begin-star .flare::after{width:2px;height:150%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.95),transparent)}
.begin-star .halo{position:absolute;inset:8%;border-radius:50%;border:1px solid rgba(232,237,255,.45);animation:pulse 2.8s ease-out infinite}
.begin-star .halo:nth-of-type(2){animation-delay:1.4s}
.begin-star:hover .core{box-shadow:0 0 16px 6px #fff,0 0 50px 22px rgba(156,199,255,.85),0 0 120px 46px rgba(255,183,201,.4)}
.begin-hint{font-family:var(--label);font-size:13px;letter-spacing:.42em;margin-right:-.42em;text-transform:uppercase;color:var(--moon);opacity:0;animation:rise 1.6s var(--ease-out) 1.2s forwards}
html[lang="ar"] .begin-hint{font-size:16px}
.sound-pref{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;font-family:var(--label);font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--soft);border:1px solid var(--line);border-radius:999px;opacity:0;animation:fadeIn 1.4s ease 1.6s forwards;transition:border-color .4s,color .4s}
.sound-pref:hover{border-color:var(--moon);color:var(--moon)}
.caption{position:absolute;left:var(--gutter);right:var(--gutter);bottom:18%;text-align:center;font-style:italic;font-size:clamp(22px,5.4vw,32px);line-height:1.4;color:var(--moon);opacity:0;transform:translateY(14px);filter:blur(6px);transition:opacity 1.1s ease,transform 1.3s var(--ease-out),filter 1.1s;pointer-events:none;text-shadow:0 0 18px rgba(156,199,255,.45)}
.caption.show{opacity:1;transform:none;filter:none}
.intro-lang{position:absolute;z-index:4;top:calc(env(safe-area-inset-top) + 12px);right:calc(var(--gutter) - 6px);transition:opacity .5s}
#intro.begun .intro-lang{opacity:0;pointer-events:none}
.lang-btn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:rgba(4,7,20,.5);font-family:"Reem Kufi",sans-serif;font-size:14px;color:var(--moon);transition:border-color .4s}
.lang-btn[lang="en"]{font-family:"Marcellus",serif;font-size:12px;letter-spacing:.2em}
.lang-btn:hover{border-color:var(--moon)}
.skip{position:absolute;z-index:3;right:calc(var(--gutter) - 8px);bottom:calc(env(safe-area-inset-bottom) + 14px);min-height:44px;padding:0 10px;font-family:var(--label);font-size:11.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--faint);transition:color .3s}
html[dir="rtl"] .skip{right:auto;left:calc(var(--gutter) - 8px)}
.skip:hover{color:var(--moon)}
/* The light when the two stars meet: a white-hot core, a round glow that fades from gold
   through rose to blue, a thin lens-flare streak and fine rays. Every layer is a circle sized
   in vmin/vmax so it stays round on tall phones. */
.intro-flash{position:absolute;inset:0;z-index:5;overflow:hidden;pointer-events:none}
.intro-flash i{position:absolute;left:50%;top:50%;opacity:0;mix-blend-mode:screen}
.fl-bloom{width:140vmax;height:140vmax;margin:-70vmax 0 0 -70vmax;border-radius:50%;background:radial-gradient(circle closest-side,rgba(255,250,240,.9) 0%,rgba(255,234,205,.62) 4%,rgba(255,206,214,.34) 11%,rgba(196,212,255,.17) 22%,rgba(156,176,255,.07) 38%,rgba(130,150,255,.02) 55%,rgba(120,140,255,0) 70%)}
.fl-core{width:18vmin;height:18vmin;margin:-9vmin 0 0 -9vmin;border-radius:50%;background:radial-gradient(circle closest-side,#fff 0%,#fff 22%,rgba(255,244,228,.75) 45%,rgba(255,226,236,.25) 72%,rgba(255,226,236,0) 100%)}
.fl-streak{width:200vw;height:2px;margin:-1px 0 0 -100vw;background:linear-gradient(90deg,transparent,rgba(156,199,255,.55) 32%,#fff 50%,rgba(255,183,201,.55) 68%,transparent);box-shadow:0 0 14px 3px rgba(210,220,255,.35)}
.fl-streak.v{width:1.5px;height:70vh;margin:-35vh 0 0 -.75px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.75) 50%,transparent);box-shadow:none}
.fl-rays{width:110vmax;height:110vmax;margin:-55vmax 0 0 -55vmax;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.2) 0deg .8deg,transparent .8deg 7deg);-webkit-mask-image:radial-gradient(circle closest-side,#000 4%,transparent 55%);mask-image:radial-gradient(circle closest-side,#000 4%,transparent 55%)}
#intro.flash .fl-bloom{animation:flBloom 1.9s cubic-bezier(.2,.7,.3,1) forwards}
#intro.flash .fl-core{animation:flCore 1.3s cubic-bezier(.2,.7,.3,1) forwards}
#intro.flash .fl-streak{animation:flStreak 1.4s cubic-bezier(.2,.8,.3,1) forwards}
#intro.flash .fl-streak.v{animation-name:flStreakV;animation-duration:1.1s}
#intro.flash .fl-rays{animation:flRays 2s ease-out forwards}

/* Equalizer bars (music) */
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.bars i{display:block;width:2px;height:3px;background:currentColor;border-radius:1px;transition:height .4s}
.playing .bars i{animation:eq .9s ease-in-out infinite alternate}
.playing .bars i:nth-child(2){animation-delay:-.3s}
.playing .bars i:nth-child(3){animation-delay:-.6s}
.playing .bars i:nth-child(4){animation-delay:-.15s}

/* ==========================================================================
   Chrome: top bar, progress, section dots, toast
   ========================================================================== */
.topbar{position:fixed;z-index:20;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) var(--gutter) 10px;background:linear-gradient(180deg,rgba(4,7,20,.85),rgba(4,7,20,0));transition:opacity 1s ease .4s}
.topbar-actions{display:flex;align-items:center;gap:8px}
body.intro-on .topbar,body.intro-on .dots{opacity:0;pointer-events:none;visibility:hidden}
.brand{display:inline-flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;font-family:"Marcellus",serif;font-size:19px;letter-spacing:.14em;color:var(--moon);direction:ltr}
.brand svg{width:12px;height:12px}
.music-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);color:var(--moon);transition:border-color .4s,box-shadow .4s}
.music-btn:hover{border-color:var(--moon);box-shadow:0 0 18px rgba(156,199,255,.35)}
.music-btn .note{width:19px;height:19px}
.music-btn .bars,.music-btn.playing .note{display:none}
.music-btn.playing .bars{display:inline-flex}
.progress{position:fixed;z-index:21;left:0;right:0;top:0;height:2px;pointer-events:none}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#fff,var(--rose));transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 10px rgba(156,199,255,.8)}
html[dir="rtl"] .progress span{transform-origin:100% 50%}
.dots{position:fixed;z-index:20;right:22px;top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:6px;transition:opacity 1s ease .6s}
html[dir="rtl"] .dots{right:auto;left:22px}
.dots a{position:relative;display:grid;place-items:center;width:28px;height:28px}
.dots a::before{content:"";width:6px;height:6px;border-radius:50%;background:rgba(232,237,255,.35);transition:background-color .4s,transform .4s,box-shadow .4s}
.dots a.on::before{background:#fff;transform:scale(1.5);box-shadow:0 0 10px #9cc7ff}
.dots a span{position:absolute;right:34px;white-space:nowrap;font-family:var(--label);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--moon);opacity:0;transform:translateX(6px);transition:opacity .35s,transform .35s;pointer-events:none}
html[dir="rtl"] .dots a span{right:auto;left:34px;transform:translateX(-6px)}
.dots a:hover span,.dots a:focus-visible span{opacity:1;transform:none}
@media (min-width:900px){.dots{display:flex}}
.toast{position:fixed;z-index:95;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translate(-50%,16px);padding:13px 22px;border-radius:999px;background:rgba(10,16,48,.94);border:1px solid var(--line);font-family:var(--label);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--moon);opacity:0;pointer-events:none;transition:opacity .5s,transform .6s var(--ease-out);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ==========================================================================
   Reveal system
   ========================================================================== */
[data-reveal]{opacity:0;transform:translateY(30px) scale(.98);filter:blur(8px);transition:opacity 1.3s var(--ease-out) var(--d,0s),transform 1.6s var(--ease-out) var(--d,0s),filter 1.3s ease var(--d,0s)}
[data-reveal].in{opacity:1;transform:none;filter:none}
[data-reveal="words"]{opacity:1;transform:none;filter:none}
[data-reveal="words"] .w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .14em;margin-bottom:-.14em}
[data-reveal="words"] .wi{display:inline-block;transform:translateY(110%) rotate(4deg);transition:transform 1.2s var(--ease-out);transition-delay:calc(var(--d,0s) + var(--i,0) * 45ms)}
[data-reveal="words"].in .wi{transform:none}
[data-reveal="zoom"]{transform:scale(.7);filter:blur(14px)}
[data-reveal="tilt"]{transform:perspective(1200px) rotateX(35deg) translateY(80px) scale(.9);transform-origin:50% 100%}
.write{-webkit-mask-image:var(--write-mask);mask-image:var(--write-mask);-webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:var(--write-from);mask-position:var(--write-from);transition:-webkit-mask-position 2.6s var(--ease-io) var(--d,0s),mask-position 2.6s var(--ease-io) var(--d,0s)}
.write.in{-webkit-mask-position:var(--write-to);mask-position:var(--write-to)}

/* ==========================================================================
   Sections
   ========================================================================== */
.sec{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(84px,12vh,140px) var(--gutter)}

/* Hero */
.sec-hero{min-height:100vh;min-height:100svh;justify-content:center;overflow:hidden}
.moon{position:absolute;top:clamp(80px,12vh,120px);right:clamp(18px,10vw,140px);width:clamp(56px,14vw,96px);aspect-ratio:1;border-radius:50%;box-shadow:inset -14px 6px 0 0 #eef1ff;filter:drop-shadow(0 0 14px rgba(232,237,255,.55)) drop-shadow(0 0 40px rgba(156,199,255,.35));transform:translateY(40px) rotate(-20deg);opacity:0;transition:transform 3s var(--ease-out) .6s,opacity 3s ease .6s}
html[dir="rtl"] .moon{right:auto;left:clamp(18px,10vw,140px);transform:translateY(40px) rotate(20deg) scaleX(-1)}
body.formed .moon{opacity:1;transform:rotate(-20deg)}
html[dir="rtl"] body.formed .moon{transform:rotate(20deg) scaleX(-1)}
.hero-inner{position:relative;display:flex;flex-direction:column;align-items:center}
.hero-eyebrow{opacity:0;transform:translateY(16px);transition:opacity 1.4s ease 2.8s,transform 1.4s var(--ease-out) 2.8s}
body.formed .hero-eyebrow{opacity:1;transform:none}
.names{margin:.25em 0 .2em;display:flex;flex-direction:column;align-items:center;line-height:1}
.names:focus{outline:none}
.name{font-family:var(--script);font-size:clamp(60px,min(22vw,20vh),190px);line-height:1.15}
/* Each name sits in a wrapper that does the writing animation (see writeNames) */
.name-wrap{display:block;opacity:0}
body.formed .name-wrap{opacity:1}
html[lang="ar"] .name{font-size:clamp(54px,min(19vw,17vh),160px);line-height:1.5}
.amp{font-family:var(--display);font-size:clamp(26px,5vw,44px);color:var(--silver);opacity:0;transform:scale(.4) rotate(-20deg);transition:opacity 1.2s ease .3s,transform 1.6s cubic-bezier(.3,1.6,.5,1) .3s}
html[lang="ar"] .amp{font-family:var(--script);font-size:clamp(36px,7vw,60px)}
body.formed .amp{opacity:1;transform:none}
.name.shine-text{text-shadow:none;filter:drop-shadow(0 0 18px rgba(156,199,255,.35))}
.lede{max-width:26ch;font-style:italic;font-size:clamp(21px,2.8vw,28px);line-height:1.45;color:var(--moon)}
html[lang="ar"] .lede{max-width:30ch}
.hero-date span{white-space:nowrap}
@media (max-height:640px){.scroll-cue{display:none}}
.hero-date{margin-top:24px;font-family:var(--label);font-size:12.5px;letter-spacing:.32em;margin-right:-.32em;text-transform:uppercase;color:var(--soft)}
html[lang="ar"] .hero-date{font-size:15.5px}
.hero-date b{font-weight:400;color:var(--rose)}
.scroll-cue{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;min-width:44px;padding:6px;text-decoration:none;font-family:var(--label);font-size:11px;letter-spacing:.4em;margin-right:-.4em;text-transform:uppercase;color:var(--faint);opacity:0;transition:opacity 1.6s ease 2.4s}
body.formed .scroll-cue{opacity:1}
.scroll-cue .cue-line{display:block;width:1px;height:44px;background:rgba(232,237,255,.15);overflow:hidden}
.scroll-cue .cue-line::after{content:"";display:block;width:100%;height:100%;background:linear-gradient(180deg,transparent,#fff);animation:cue 2.2s var(--ease-io) infinite}

/* Story: a constellation drawn by scrolling */
.sec-story{height:300vh;padding:0}
.story-sticky{position:sticky;top:0;width:100%;height:100vh;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,22px);padding:70px var(--gutter) 40px;overflow:hidden}
.constellation{width:min(86vw,440px,52vh);height:auto;overflow:visible}
.c-line{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke .8s}
.c-left{stroke:var(--blue)}
.c-right{stroke:var(--rose)}
.met .c-line{stroke:var(--gold)}
.c-star{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:opacity .5s,transform .7s cubic-bezier(.3,1.8,.5,1)}
.c-star.on{opacity:1;transform:scale(1)}
.c-meet{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:opacity .6s,transform 1s cubic-bezier(.3,1.8,.5,1)}
.met .c-meet{opacity:1;transform:scale(1)}
.c-ring{fill:none;stroke:#fff;stroke-width:1;opacity:0;transform-box:fill-box;transform-origin:center}
.met .c-ring{animation:ring 2.4s ease-out infinite}
.c-bg circle{fill:#dfe6ff}
.c-initial{font-family:"Great Vibes",cursive;font-size:22px;fill:var(--moon);opacity:0;transition:opacity 1s}
.c-initial.on{opacity:.9}
.story-lines{position:relative;width:min(100%,520px);min-height:3.4em}
.story-line{position:absolute;inset:0;font-style:italic;font-size:clamp(22px,5vw,30px);line-height:1.4;color:var(--moon);opacity:0;transform:translateY(16px);filter:blur(6px);transition:opacity .9s ease,transform 1s var(--ease-out),filter .9s;text-shadow:0 0 18px rgba(156,199,255,.35)}
.story-line.on{opacity:1;transform:none;filter:none}
.story-foot{max-width:30ch;font-family:var(--label);font-size:12px;letter-spacing:.26em;margin-right:-.26em;line-height:1.8;text-transform:uppercase;color:var(--gold);opacity:0;transition:opacity 1s}
html[lang="ar"] .story-foot{letter-spacing:0;margin-right:0;font-size:16px}
.met .story-foot{opacity:1}

/* Date: an orbit with the date written around it */
.orbit{position:relative;width:min(88vw,430px);aspect-ratio:1;margin-top:26px}
.orbit svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
/* Laid out left to right along the circle even in Arabic; Arabic runs still read right to left */
.orbit .ring-text{font-family:"Marcellus",serif;font-size:13px;letter-spacing:3px;fill:var(--soft);direction:ltr;unicode-bidi:isolate}
html[lang="ar"] .orbit .ring-text{font-family:"Reem Kufi",sans-serif;font-size:15px;letter-spacing:0}
.orbit .spin-slow{transform-origin:160px 160px;animation:spin 60s linear infinite}
.orbit .spin-fast{transform-origin:160px 160px;animation:spin 9s linear infinite}
.orbit .spin-rev{transform-origin:160px 160px;animation:spin 14s linear infinite reverse}
.orbit .track{fill:none;stroke:rgba(232,237,255,.16);stroke-width:1}
.orbit .track.dash{stroke-dasharray:2 6}
.orbit-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.orbit-mid small{font-family:var(--label);font-size:clamp(11px,2.8vw,13px);letter-spacing:.36em;margin-right:-.36em;text-transform:uppercase;color:var(--silver)}
html[lang="ar"] .orbit-mid small{font-size:16px}
.orbit-mid .day{font-family:var(--display);font-size:clamp(84px,24vw,150px);line-height:1;padding-top:.04em}
html[lang="ar"] .orbit-mid .day{line-height:1.25}
.time-line{margin-top:24px;font-style:italic;font-size:clamp(21px,2.8vw,27px);color:var(--moon)}
.time-line span{color:var(--gold)}
.cal{position:relative;margin-top:26px}
.cal-menu{position:absolute;left:50%;top:calc(100% + 10px);z-index:5;min-width:250px;transform:translateX(-50%);display:flex;flex-direction:column;padding:8px;border-radius:20px;background:rgba(10,16,48,.97);border:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
.cal-menu[hidden]{display:none}
.cal-menu a,.cal-menu button{display:flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:14px;font-family:var(--label);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--text);text-decoration:none;transition:background-color .3s}
.cal-menu a:hover,.cal-menu button:hover{background:rgba(156,199,255,.12)}

/* Countdown: four orbit rings */
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,3vw,28px);width:min(100%,680px);margin-top:38px}
.gauge{position:relative;display:flex;flex-direction:column;align-items:center}
.gauge-ring{position:relative;width:100%;aspect-ratio:1}
.gauge svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.g-bg{fill:none;stroke:rgba(232,237,255,.12);stroke-width:3}
.g-fg{fill:none;stroke:url(#gRing);stroke-width:3;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset .9s var(--ease-out);filter:drop-shadow(0 0 4px rgba(156,199,255,.8))}
.g-num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:clamp(24px,7vw,46px);color:var(--moon);font-variant-numeric:tabular-nums}
.g-num.tick{animation:tick .6s var(--ease-out)}
.lbl{display:block;margin-top:12px;font-family:var(--label);font-size:clamp(11px,2.8vw,12px);letter-spacing:.18em;margin-right:-.18em;text-transform:uppercase;color:var(--soft)}
html[lang="ar"] .lbl{font-size:clamp(12px,3vw,14px)}
.count-done{max-width:26ch;margin-top:32px;font-style:italic;font-size:clamp(22px,3vw,28px);color:var(--moon)}

/* Venue: a porthole to the map */
.venue-name{margin:.3em 0 .1em;font-family:var(--display);font-size:clamp(50px,12vw,104px);line-height:1.1;letter-spacing:.04em}
html[lang="ar"] .venue-name{line-height:1.4}
.venue-sub{font-style:italic;font-size:clamp(20px,2.6vw,26px);line-height:1.5;color:var(--moon)}
.porthole{position:relative;width:min(82vw,400px);aspect-ratio:1;margin-top:40px;border-radius:50%;padding:10px;background:conic-gradient(from 0deg,rgba(156,199,255,.6),rgba(255,183,201,.5),rgba(233,207,152,.6),rgba(156,199,255,.6));box-shadow:0 0 70px -6px rgba(156,199,255,.35)}
.porthole::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px dashed rgba(232,237,255,.25);animation:spin 50s linear infinite}
.porthole-inner{position:absolute;inset:3px;border-radius:50%;overflow:hidden;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black);background:#0a1030;border:6px solid var(--night)}
.porthole iframe{position:absolute;inset:-10%;width:120%;height:120%;border:0;opacity:0;filter:invert(.9) hue-rotate(200deg) saturate(.6) brightness(.9) contrast(1.05);transition:opacity 1.2s ease}
.porthole-inner.loaded iframe{opacity:1}
.porthole-inner::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 50px rgba(4,7,20,.9)}
.map-wait{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--label);font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--soft)}
.porthole-inner.loaded .map-wait{display:none}
.ping{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,183,201,.9);pointer-events:none;z-index:2}
.ping::before,.ping::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,183,201,.85);animation:ping 2.4s ease-out infinite}
.ping::after{animation-delay:1.2s}

/* Finale */
.sec-finale{min-height:100vh;min-height:100svh;justify-content:center;overflow:hidden;padding-bottom:calc(env(safe-area-inset-bottom) + 70px)}
.infinity{width:min(84vw,420px);height:auto;overflow:visible}
.inf-path{fill:none;stroke:rgba(232,237,255,.22);stroke-width:1.2;stroke-dasharray:3 7;animation:dashflow 3s linear infinite}
.inf-glow{fill:none;stroke:url(#gInf);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 3s var(--ease-io)}
.sec-finale.seen .inf-glow{stroke-dashoffset:0}
.finale-line{margin-top:26px;font-family:var(--display);font-size:clamp(17px,3.6vw,22px);letter-spacing:.2em;margin-right:-.2em;text-transform:uppercase;color:var(--silver)}
html[lang="ar"] .finale-line{letter-spacing:0;margin-right:0;text-transform:none;font-size:clamp(20px,4.4vw,26px)}
.finale-script{margin-top:6px;font-family:var(--script);font-size:clamp(54px,14vw,124px);line-height:1.2}
html[lang="ar"] .finale-script{font-size:clamp(46px,11vw,100px);line-height:1.6}
.finale-names{margin-top:6px;font-family:var(--display);font-size:clamp(16px,2vw,19px);letter-spacing:.32em;margin-right:-.32em;text-transform:uppercase;color:var(--moon)}
html[lang="ar"] .finale-names{letter-spacing:0;margin-right:0;font-size:clamp(20px,2.4vw,24px)}
.finale-date{margin-top:10px;font-family:var(--label);font-size:12.5px;letter-spacing:.46em;margin-right:-.46em;color:var(--soft)}
.finale-foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);font-family:var(--label);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--faint)}

.seam{display:flex;align-items:center;gap:14px;width:min(70%,420px);margin:0 auto;color:var(--moon)}
.seam i{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(232,237,255,.6));transform:scaleX(0);transform-origin:100% 50%;transition:transform 1.8s var(--ease-out) .2s}
.seam i:last-child{background:linear-gradient(270deg,transparent,rgba(232,237,255,.6));transform-origin:0 50%}
.seam.in i{transform:scaleX(1)}
.seam svg{width:14px;height:14px;flex:none;filter:drop-shadow(0 0 6px rgba(156,199,255,.9))}

@media (max-width:600px){
  .sec{padding-top:68px;padding-bottom:68px}
  .sec-story{padding:0}
  .sec-finale{min-height:88vh;min-height:88svh}
  .gauges{gap:8px}
}

/* ==========================================================================
   Keyframes
   ========================================================================== */
@keyframes fadeIn{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes sheen{from{background-position:0% 50%}to{background-position:220% 50%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes corePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes flBloom{0%{opacity:0;transform:scale(.12)}16%{opacity:1}100%{opacity:0;transform:scale(1)}}
@keyframes flCore{0%{opacity:0;transform:scale(.2)}10%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes flStreak{0%{opacity:0;transform:scaleX(0)}14%{opacity:1}100%{opacity:0;transform:scaleX(1)}}
@keyframes flStreakV{0%{opacity:0;transform:scaleY(0)}14%{opacity:.9}100%{opacity:0;transform:scaleY(1)}}
@keyframes flRays{0%{opacity:0;transform:scale(.25) rotate(0)}18%{opacity:.85}100%{opacity:0;transform:scale(1) rotate(22deg)}}
@keyframes eq{from{height:3px}to{height:14px}}
@keyframes cue{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes ring{0%{opacity:.8;transform:scale(.4)}100%{opacity:0;transform:scale(3)}}
@keyframes ping{0%{transform:scale(.5);opacity:1}100%{transform:scale(4);opacity:0}}
@keyframes tick{0%{transform:scale(1.25);text-shadow:0 0 16px #fff}100%{transform:none;text-shadow:none}}
@keyframes dashflow{to{stroke-dashoffset:-20}}
@keyframes drift1{to{transform:translate(30vw,25vh) scale(1.2)}}
@keyframes drift2{to{transform:translate(-35vw,-20vh) scale(.85)}}
@keyframes drift3{to{transform:translate(20vw,-30vh) scale(1.15)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;animation-delay:0s!important;transition-delay:0s!important}
}
/* Phones: the same motion without the GPU-heavy blurs, frosted glass and blend modes */
html.lite .btn{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(10,16,48,.62)}

html.lite #intro.begun .begin,html.lite .caption,html.lite .story-line{filter:none}
html.lite .intro-flash i{mix-blend-mode:normal}

  b.classList.toggle('playing', on);
  b.setAttribute('aria-pressed', on);
  b.setAttribute('aria-label', T(on ? 'pauseMusic' : 'playMusic'));
}
Music.onChange(syncMusicUI);

/* ==========================================================================
   Opening: touch the star → warp → two stars meet → stardust writes the names
   ========================================================================== */
const Intro = (() => {
  const el = $('#intro');
  let timers = [], stage = 'idle', fontsReady = Promise.resolve();
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const caption = n => $$('.caption', el).forEach(c => c.classList.toggle('show', +c.dataset.n === n));

  function start() {
    clear();
    stage = 'ready';
    html.classList.add('locked');
    document.body.classList.add('intro-on');
    document.body.classList.remove('formed');
    $$('.name-wrap').forEach(w => w.getAnimations().forEach(a => a.cancel()));
    jumpTop();
    el.hidden = false;
    el.className = '';
    caption(0);
    Sky.shooting(.12);
  }
  function begin() {
    if (stage !== 'ready') return;
    stage = 'story';
    if (soundPref) Music.play();
    try { navigator.vibrate && navigator.vibrate(12); } catch {}
    el.classList.add('begun');
    const r = $('.begin-star').getBoundingClientRect();
    Sky.burst(r.left + r.width / 2, r.top + r.height / 2, small ? 60 : 90);
    if (reduce) { later(finish, 300); return; }
    Sky.warp(2300);
    later(() => caption(1), 300);
    later(() => caption(0), 2100);
    later(() => { caption(2); Sky.couple(3000, meet); }, 2200);
    fontsReady = document.fonts.load(`100px ${getComputedStyle($('.name')).fontFamily}`, C.p1 + C.p2).catch(() => {});
  }
  function meet() {
    if (stage !== 'story') return;
    caption(0);
    el.classList.add('flash');
    try { navigator.vibrate && navigator.vibrate([10, 40, 18]); } catch {}
    Sky.shock(innerWidth / 2, innerHeight / 2);
    Sky.burst(innerWidth / 2, innerHeight / 2, small ? 70 : 120);
    fontsReady.then(() => { if (stage === 'story') Sky.form(namePoints(), innerWidth / 2, innerHeight / 2); });
    later(finish, 3100);
  }
  // Each name writes itself out of the stardust like handwriting (right to left in Arabic), sharpening
  // out of a glow as the stroke passes; Amira starts a second after Ahmed. Driven by the Web Animations
  // API on a plain wrapper, because Safari skips mask/blur transitions on gradient-clipped text.
  function writeNames() {
    if (reduce) return;
    const rtl = html.dir === 'rtl', from = rtl ? '0% 0%' : '100% 0%', to = rtl ? '100% 0%' : '0% 0%';
    const mask = `linear-gradient(${rtl ? 260 : 100}deg,#000 42%,transparent 58%)`;
    $$('.names .name-wrap').forEach((w, i) => {
      w.style.webkitMaskImage = w.style.maskImage = mask;
      w.style.webkitMaskSize = w.style.maskSize = '300% 100%';
      w.style.webkitMaskRepeat = w.style.maskRepeat = 'no-repeat';
      // Phones skip the blur: it is the costly part and the stroke carries the effect.
      const f0 = lite ? {} : { filter: 'blur(12px) brightness(1.8)' }, f1 = lite ? {} : { filter: 'blur(0px) brightness(1)' };
      w.animate([
        Object.assign({ opacity: 0, transform: 'scale(1.06)', webkitMaskPosition: from, maskPosition: from }, f0),
        { opacity: 1, offset: .12 },
        Object.assign({ opacity: 1, transform: 'scale(1)', webkitMaskPosition: to, maskPosition: to }, f1)
      ], { duration: 2600, delay: i * 1000, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'both' });
    });
  }
  // Screen positions of the hero names, sampled from an offscreen drawing of the same text.
  function namePoints() {
    const els = $$('.names .name, .names .amp');
    const c = document.createElement('canvas');
    const w = c.width = innerWidth, h = c.height = innerHeight;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.fillStyle = '#fff';
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';
    els.forEach(e => {
      const r = e.getBoundingClientRect(), cs = getComputedStyle(e);
      g.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      g.direction = cs.direction;
      // Baseline as the browser lays it out: padding, then half the leading, then the font ascent.
      const m = g.measureText(e.textContent), fa = m.fontBoundingBoxAscent, fd = m.fontBoundingBoxDescent;
      const lh = parseFloat(cs.lineHeight) || (fa + fd), padTop = parseFloat(cs.paddingTop) || 0;
      const y = fa ? r.top + padTop + (lh - (fa + fd)) / 2 + fa : r.top + r.height / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
      g.fillText(e.textContent, r.left + r.width / 2, y);
    });
    const data = g.getImageData(0, 0, w, h).data, pts = [];
    for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) if (data[(y * w + x) * 4 + 3] > 140) pts.push([x, y]);
    const max = small ? 1200 : 2600;
    if (pts.length <= max) return pts;
    const keep = max / pts.length;
    return pts.filter(() => Math.random() < keep);
  }
  function finish() {
    clear();
    stage = 'done';
    Sky.cancelCouple();
    document.body.classList.remove('intro-on');
    document.body.classList.add('formed');
    writeNames();
    html.classList.remove('locked');
    el.classList.add('leaving');
    later(() => Sky.dissolve(), 2600);
    Page.start();
    later(() => { el.hidden = true; el.className = ''; }, 2800);
  }
  function skip() {
    if (stage === 'done') return;
    clear();
    stage = 'skipping';
    el.classList.add('flash');
    later(finish, 400);
  }
  $('.begin-star').addEventListener('click', begin);
  $('.skip').addEventListener('click', skip);
  $('.sound-pref').addEventListener('click', () => setSoundPref(!soundPref));
  return { start };
})();

/* ==========================================================================
   Page: reveals, the scroll-drawn constellation, parallax, progress, navigation
   ========================================================================== */
const Page = (() => {
  let started = false;
  const reveal = new IntersectionObserver(entries => entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); reveal.unobserve(e.target); }
  }), { threshold: .15, rootMargin: '0px 0px -6% 0px' });
  const seen = new IntersectionObserver(entries => entries.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add('seen');
    seen.unobserve(e.target);
    if (e.target.id === 'finale') setTimeout(() => $('.finale-script').classList.add('in'), 700);
  }), { threshold: .25 });
  // A shower of shooting stars over the closing scene.
  const finaleWatch = new IntersectionObserver(([e]) => Sky.shooting(e.isIntersecting ? 1.6 : .12), { threshold: .35 });

  const story = $('#story'), left = $('.c-left'), right = $('.c-right'), initialsEls = $$('.c-initial'), lines = $$('.story-line');
  let cStars = [];
  function drawStory() {
    const r = story.getBoundingClientRect(), vh = innerHeight;
    const p = clamp(-r.top / Math.max(1, r.height - vh), 0, 1);
    const draw = clamp(p / .78, 0, 1);
    if (!cStars.length) cStars = $$('.c-star');
    left.style.strokeDashoffset = right.style.strokeDashoffset = (1 - draw).toFixed(4);
    cStars.forEach(s => s.classList.toggle('on', draw >= +s.dataset.i / 8 - .001 && p > .01));
    initialsEls.forEach(e => e.classList.toggle('on', p > .04));
    const line = p < .05 ? -1 : p < .34 ? 0 : p < .68 ? 1 : 2;
    lines.forEach((l, i) => l.classList.toggle('on', i === line));
    const met = draw >= 1;
    if (met && !story.classList.contains('met')) {
      const m = $('.c-meet').getBoundingClientRect();
      Sky.burst(m.left + m.width / 2, m.top + m.height / 2, small ? 40 : 70);
    }
    story.classList.toggle('met', met);
  }

  const px = $$('[data-parallax]');
  const bar = $('.progress span');
  let ticking = false, lastY = scrollY;
  function update() {
    ticking = false;
    const vh = innerHeight;
    Sky.nudge(scrollY - lastY);
    lastY = scrollY;
    if (!reduce) px.forEach(el => {
      const r = el.parentElement.getBoundingClientRect();
      if (r.bottom < -100 || r.top > vh + 100) return;
      el.style.translate = `0 ${((r.top + r.height / 2 - vh / 2) * -parseFloat(el.dataset.parallax)).toFixed(1)}px`;
    });
    drawStory();
    const max = html.scrollHeight - vh;
    bar.style.transform = `scaleX(${max > 0 ? clamp(scrollY / max, 0, 1) : 0})`;
    const secs = $$('main > section'), dots = $$('.dots a');
    let cur = 0;
    secs.forEach((s, i) => { if (s.getBoundingClientRect().top < vh * .5) cur = i; });
    dots.forEach((d, i) => { d.classList.toggle('on', i === cur); if (i === cur) d.setAttribute('aria-current', 'true'); else d.removeAttribute('aria-current'); });
  }
  const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };

  function start() {
    if (!started) {
      started = true;
      $$('[data-reveal]').forEach(el => reveal.observe(el));
      $$('main > section').forEach(el => seen.observe(el));
      finaleWatch.observe($('#finale'));
      addEventListener('scroll', onScroll, { passive: true });
      addEventListener('resize', onScroll);
    }
    lastY = scrollY;
    update();
    setTimeout(() => $('.names').focus({ preventScroll: true }), 600);
  }
  return { start, refresh: () => { if (started) update(); } };
})();

/* ==========================================================================
   Countdown: four rings
   ========================================================================== */
const Countdown = (() => {
  const units = Object.fromEntries($$('.g-num').map(n => [n.dataset.u, { num: n, ring: $('.g-fg', n.parentElement) }]));
  const box = $('.gauges');
  let lastLabel = '', timer = 0;
  function set(u, v, frac) {
    const { num: n, ring } = units[u], s = num(v, 2);
    const prev = parseFloat(ring.dataset.f || '0');
    ring.style.transition = frac < prev - .5 ? 'none' : '';
    ring.style.strokeDashoffset = ((1 - frac) * 339.3).toFixed(2);
    ring.dataset.f = frac;
    if (n.dataset.v === s) return;
    const first = !n.dataset.v;
    n.dataset.v = s;
    n.textContent = s;
    if (!first && !reduce) { n.classList.remove('tick'); void n.offsetWidth; n.classList.add('tick'); }
  }
  function tick() {
    clearTimeout(timer);
    const diff = when.getTime() - Date.now();
    if (diff <= 0) {
      box.hidden = true;
      $('.count-done').hidden = false;
      box.closest('section').querySelectorAll('.eyebrow,.sec-title').forEach(e => { e.hidden = true; });
      return;
    }
    const d = Math.floor(diff / 864e5), h = Math.floor(diff / 36e5) % 24, m = Math.floor(diff / 6e4) % 60, s = Math.floor(diff / 1e3) % 60;
    set('d', d, clamp(d / 30, 0, 1)); set('h', h, h / 24); set('m', m, m / 60); set('s', s, s / 60);
    const label = T('countLeft')(d, h, m);
    if (label !== lastLabel) { box.setAttribute('aria-label', label); lastLabel = label; }
    timer = setTimeout(tick, 1000 - (Date.now() % 1000) + 10);
  }
  function refresh() {
    Object.values(units).forEach(u => { delete u.num.dataset.v; });
    lastLabel = '';
    tick();
  }
  return { refresh };
})();

/* ==========================================================================
   Calendar, map, sharing
   ========================================================================== */
function utc(d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
const ends = new Date(when.getTime() + CONFIG.durationHours * 36e5);

function setupCalendarLinks() {
  const g = new URL('https://calendar.google.com/calendar/render');
  g.searchParams.set('action', 'TEMPLATE');
  g.searchParams.set('text', T('eventTitle')(C.p1, C.p2));
  g.searchParams.set('dates', `${utc(when)}/${utc(ends)}`);
  g.searchParams.set('details', T('eventText')(C.p1, C.p2));
  g.searchParams.set('location', C.address);
  $('#gcalLink').href = g.toString();
}
function setupCalendar() {
  const btn = $('#calBtn'), menu = $('#calMenu');
  const close = () => { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
  btn.addEventListener('click', e => {
    e.stopPropagation();
    menu.hidden = !menu.hidden;
    btn.setAttribute('aria-expanded', String(!menu.hidden));
  });
  document.addEventListener('click', e => { if (!e.target.closest('.cal')) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  $('#gcalLink').addEventListener('click', close);
  // A real file next to the page: iPhones and WhatsApp's browser then offer "Add to Calendar".
  $('#icsBtn').addEventListener('click', () => {
    close();
    location.href = new URL(CONFIG.icsFile, location.href).href;
  });
}
function setupVenue() {
  const q = encodeURIComponent(CONFIG.mapsQuery);
  $('#dirLink').href = CONFIG.mapsLink || `https://www.google.com/maps/search/?api=1&query=${q}`;
  $('#copyAddr').addEventListener('click', () => copy(C.address, T('addrCopied')));
  const frame = $('.porthole iframe'), inner = $('.porthole-inner');
  frame.addEventListener('load', () => { if (frame.src) inner.classList.add('loaded'); });
  const io = new IntersectionObserver(([e]) => {
    if (!e.isIntersecting) return;
    frame.src = `https://maps.google.com/maps?q=${q}&z=15&output=embed`;
    io.disconnect();
  }, { rootMargin: '600px 0px' });
  io.observe($('.porthole'));
}
function setupActions() {
  $('#shareBtn').addEventListener('click', async () => {
    const url = location.href.split(/[?#]/)[0];
    const data = { title: T('eventTitle')(C.p1, C.p2), text: T('shareText')(C.p1, C.p2, C.dateLong), url };
    if (navigator.share) { try { await navigator.share(data); } catch {} }
    else copy(url, T('linkCopied'));
  });
  $('#replayBtn').addEventListener('click', () => Intro.start());
  // Pausing from the top bar also means "in silence" if the opening is replayed.
  $('.music-btn').addEventListener('click', () => { Music.toggle(); setSoundPref(Music.on); });
  $$('.lang-btn').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); setLanguage(T('langSwitchCode')); }));
}

/* ==========================================================================
   Access screen (testing only)
   ========================================================================== */
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function unlock() {
  const A = CONFIG.testAccess;
  if (!A || !A.enabled) return Promise.resolve();
  const KEY = 'invite-access';
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  if (saved === A.codeHash) return Promise.resolve();

  const gate = $('#gate'), form = $('#gateForm'), input = $('#gateCode'), err = $('.gate-err'), card = $('.gate-card');
  const check = async code => !!(window.crypto && window.crypto.subtle) && code.trim() !== '' && (await sha256(code.trim().toLowerCase())) === A.codeHash;
  const remember = () => { try { localStorage.setItem(KEY, A.codeHash); } catch {} };

  return new Promise(async resolve => {
    // A tester link ending in ?access=CODE opens straight in; the code is then removed from the address bar.
    const fromLink = params.get('access');
    if (fromLink) {
      const u = new URL(location.href);
      u.searchParams.delete('access');
      history.replaceState(null, '', u);
      if (await check(fromLink)) { remember(); resolve(); return; }
    }
    if (A.requestWhatsApp) {
      const req = $('.gate-request');
      req.href = `https://wa.me/${A.requestWhatsApp.replace(/\D/g, '')}?text=${encodeURIComponent('Hello! May I have the access code for the engagement invitation preview?')}`;
      req.hidden = false;
    }
    gate.hidden = false;
    setTimeout(() => input.focus(), 300);
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (!(window.crypto && window.crypto.subtle)) { err.textContent = 'Please open the invitation from its https:// link.'; return; }
      if (await check(input.value)) {
        remember();
        err.textContent = '';
        gate.classList.add('done');
        setTimeout(() => gate.remove(), 1000);
        resolve();
      } else {
        err.textContent = "That code isn't right · الرمز غير صحيح";
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
        input.select();
      }
    });
  });
}

/* ==========================================================================
   Boot
   ========================================================================== */
// A burst of starlight wherever the guest touches.
if (!reduce) addEventListener('pointerdown', e => { if (e.button === 0) Sky.burst(e.clientX, e.clientY, 12); }, { passive: true });

async function boot() {
  await unlock();
  Sky.start();
  if (reduce) $('.infinity').pauseAnimations();
  buildOnce();
  applyLanguage();
  setupCalendar();
  setupVenue();
  setupActions();
  try { await Promise.race([document.fonts.ready, wait(2600)]); } catch {}
  await wait(reduce ? 150 : 600);
  $('#loader').classList.add('done');
  setTimeout(() => $('#loader').remove(), 1100);
  Intro.start();
}
boot();
})();
</script>
